name: validate

# Reusable workflow: the consuming repository calls it with
#   uses: Scrap-Node/toolkit/.github/workflows/validate.yml@<tag>
# and the checks come from the toolkit submodule it pins.
on:
  workflow_call:
    inputs:
      toolkit-path:
        description: Chemin du toolkit dans le dépôt appelant.
        type: string
        default: toolkit

jobs:
  validate:
    runs-on: ubuntu-latest
    # A stuck mirror or tool must fail the check, not hold it for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Outils de validation
        # Both usually ship with the runner image. apt, and its mirrors, only
        # come in when one is missing.
        run: |
          if command -v shellcheck >/dev/null && python3 -c 'import yaml' 2>/dev/null; then
            echo "shellcheck $(shellcheck --version | sed -n 's/^version: //p') et PyYAML déjà présents"
          else
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq shellcheck python3-yaml
          fi

      - name: Contrôles
        env:
          TOOLKIT_PATH: ${{ inputs.toolkit-path }}
        run: '"$TOOLKIT_PATH/validate/validate.sh"'
